<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tömb módosítása</title>
</head>

<body>
    <h3>Tömb elemeinek módosítása</h3>
    <strong>Előtte: </strong> <p id="n6f7ub"> </p>
    <strong>Utána: </strong> <p id="n6f7ub1"> </p>
    
    <button onclick="modosit()">Tömbelem módosítása </button>

    <script>
        let prognyelvek = ["HTML5", "CSS3", "JS"];

        document.getElementById("n6f7ub").innerHTML = prognyelvek;
        prognyelvek[1] = "C nyelv";

        function modosit(){
            document.getElementById("n6f7ub1").innerHTML = prognyelvek;
        }
    </script>

</body>
</html>
